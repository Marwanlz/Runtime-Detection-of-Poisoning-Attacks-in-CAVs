services:
  edge_siem:
    build:
      context: .
      dockerfile: edge_siem/Dockerfile
    container_name: edge_siem_hybrid
    ports:
      - "5000:5000"
    volumes:
      - ./edge_siem/logs:/app/logs

  vehicle1_onboard:
    build:
      context: .
      dockerfile: vehicle1_onboard/Dockerfile
    container_name: veh1_on_board
    depends_on:
      - edge_siem
    environment:
      - MODE=hybrid
    volumes:
      - ./vehicle1_onboard/logs:/app/logs

  vehicle2_onboard:
